<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Tickets</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-header">
        <div class="container">
            <h1>🎫 Support Ticket System</h1>
            <p>Manage and track all your support requests</p>
        </div>
    </div>

    <div class="container">
        <div class="main-layout">
            <!-- Ticket List Section -->
            <div class="ticket-list-section">
                <div class="section-header">
                    <h2>All Tickets</h2>
                    <span class="ticket-count" id="ticketCount">0</span>
                </div>

                <div class="filters">
                    <select class="filter-select" id="statusFilter">
                        <option value="all">All Status</option>
                        <option value="open">Open</option>
                        <option value="in-progress">In Progress</option>
                        <option value="closed">Closed</option>
                    </select>
                    <button class="btn btn-primary" onclick="showNewTicketModal()">+ New Ticket</button>
                </div>

                <div id="ticketList">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>Loading tickets...</p>
                    </div>
                </div>
            </div>

            <!-- Ticket Detail Section -->
            <div class="ticket-detail-section">
                <div class="empty-state" id="emptyState">
                    <div class="empty-state-icon">📋</div>
                    <h3>No Ticket Selected</h3>
                    <p>Select a ticket from the list to view details and messages</p>
                </div>

                <div id="ticketDetail" style="display: none;">
                    <!-- Ticket details will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- New Ticket Modal (Simple overlay) -->
    <div id="newTicketModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 2rem; border-radius: 8px; max-width: 500px; width: 90%;">
            <h2 style="margin-bottom: 1.5rem;">Create New Ticket</h2>
            <form id="newTicketForm">
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Title *</label>
                    <input type="text" id="ticketTitle" required style="width: 100%; padding: 0.75rem; border: 2px solid #e1e8ed; border-radius: 6px; font-size: 0.95rem;">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Description</label>
                    <textarea id="ticketDescription" rows="4" style="width: 100%; padding: 0.75rem; border: 2px solid #e1e8ed; border-radius: 6px; font-size: 0.95rem; font-family: inherit;"></textarea>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="hideNewTicketModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentTicketId = null;
        let allTickets = [];

        // Load tickets on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadTickets();
            
            // Status filter change
            document.getElementById('statusFilter').addEventListener('change', function() {
                loadTickets(this.value);
            });

            // New ticket form submission
            document.getElementById('newTicketForm').addEventListener('submit', function(e) {
                e.preventDefault();
                createNewTicket();
            });
        });

        async function loadTickets(status = 'all') {
            try {
                const response = await fetch(`/api/tickets?status=${status}`);
                allTickets = await response.json();
                renderTicketList(allTickets);
            } catch (error) {
                console.error('Error loading tickets:', error);
                document.getElementById('ticketList').innerHTML = '<div class="empty-state"><p>Error loading tickets</p></div>';
            }
        }

        function renderTicketList(tickets) {
            const ticketList = document.getElementById('ticketList');
            document.getElementById('ticketCount').textContent = tickets.length;

            if (tickets.length === 0) {
                ticketList.innerHTML = '<div class="empty-state" style="padding: 2rem;"><p>No tickets found</p></div>';
                return;
            }

            ticketList.innerHTML = tickets.map(ticket => `
                <div class="ticket-card ${currentTicketId === ticket.ticket_id ? 'selected' : ''}" onclick="selectTicket('${ticket.ticket_id}')">
                    <div class="ticket-header">
                        <span class="ticket-id">${ticket.ticket_id}</span>
                        <span class="ticket-status status-${ticket.status}">${ticket.status}</span>
                    </div>
                    <div class="ticket-title">${ticket.title}</div>
                    <div class="ticket-meta">
                        <span>👤 ${ticket.created_by ? ticket.created_by.split('@')[0] : 'Unknown'}</span>
                        <span>🕐 ${formatDate(ticket.created_at)}</span>
                    </div>
                </div>
            `).join('');
        }

        async function selectTicket(ticketId) {
            currentTicketId = ticketId;
            renderTicketList(allTickets); // Re-render to show selected state

            try {
                const [ticketResponse, messagesResponse] = await Promise.all([
                    fetch(`/api/tickets/${ticketId}`),
                    fetch(`/api/tickets/${ticketId}/messages`)
                ]);

                const ticket = await ticketResponse.json();
                const messages = await messagesResponse.json();

                renderTicketDetail(ticket, messages);
            } catch (error) {
                console.error('Error loading ticket details:', error);
            }
        }

        function renderTicketDetail(ticket, messages) {
            document.getElementById('emptyState').style.display = 'none';
            const detailSection = document.getElementById('ticketDetail');
            detailSection.style.display = 'block';

            detailSection.innerHTML = `
                <div class="ticket-detail-header">
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <div>
                            <h2 class="ticket-detail-title">${ticket.title}</h2>
                            <div class="ticket-detail-meta">
                                <span><strong>ID:</strong> ${ticket.ticket_id}</span>
                                <span><strong>Status:</strong> <span class="ticket-status status-${ticket.status}">${ticket.status}</span></span>
                                <span><strong>Created By:</strong> ${ticket.created_by}</span>
                                <span><strong>Created:</strong> ${formatDate(ticket.created_at)}</span>
                            </div>
                        </div>
                        <div>
                            <select class="filter-select" onchange="updateTicketStatus('${ticket.ticket_id}', this.value)">
                                <option value="open" ${ticket.status === 'open' ? 'selected' : ''}>Open</option>
                                <option value="in-progress" ${ticket.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                                <option value="closed" ${ticket.status === 'closed' ? 'selected' : ''}>Closed</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="messages-section">
                    <h3 class="messages-header">💬 Messages</h3>
                    <div class="message-thread">
                        ${messages.map(msg => `
                            <div class="message ${msg.author && msg.author.includes('@') ? 'user-message' : 'support-message'}">
                                <div class="message-avatar">${msg.author ? msg.author.charAt(0).toUpperCase() : 'U'}</div>
                                <div class="message-content">
                                    <div class="message-header">
                                        <span class="message-author">${msg.author || 'Unknown'}</span>
                                        <span class="message-time">${formatDate(msg.created_at)}</span>
                                    </div>
                                    <div class="message-body">${msg.message_text}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="reply-form">
                        <textarea id="replyMessage" placeholder="Type your reply..."></textarea>
                        <button class="btn btn-primary" style="margin-top: 1rem;" onclick="sendReply('${ticket.ticket_id}')">Send Reply</button>
                    </div>
                </div>
            `;
        }

        async function createNewTicket() {
            const title = document.getElementById('ticketTitle').value;
            const description = document.getElementById('ticketDescription').value;

            try {
                const response = await fetch('/api/tickets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description })
                });

                if (response.ok) {
                    hideNewTicketModal();
                    document.getElementById('newTicketForm').reset();
                    loadTickets();
                }
            } catch (error) {
                console.error('Error creating ticket:', error);
                alert('Failed to create ticket');
            }
        }

        async function updateTicketStatus(ticketId, newStatus) {
            try {
                await fetch(`/api/tickets/${ticketId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                loadTickets();
                selectTicket(ticketId);
            } catch (error) {
                console.error('Error updating ticket:', error);
            }
        }

        async function sendReply(ticketId) {
            const message = document.getElementById('replyMessage').value.trim();
            if (!message) return;

            try {
                await fetch(`/api/tickets/${ticketId}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                document.getElementById('replyMessage').value = '';
                selectTicket(ticketId);
                loadTickets();
            } catch (error) {
                console.error('Error sending reply:', error);
            }
        }

        function showNewTicketModal() {
            document.getElementById('newTicketModal').style.display = 'flex';
        }

        function hideNewTicketModal() {
            document.getElementById('newTicketModal').style.display = 'none';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays < 7) return `${diffDays}d ago`;
            return date.toLocaleDateString();
        }
    </script>
</body>
</html>
